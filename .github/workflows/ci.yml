name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest

      - name: Validate skill metadata
        run: python engineering-thesis-zh\scripts\validate_skill.py engineering-thesis-zh

      - name: Public safety scan
        run: python engineering-thesis-zh\scripts\check_public_safety.py .
